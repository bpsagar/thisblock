<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>thisblock sounds</title>
<style>
:root{--bg:#fff;--ink:#000;--muted:#6b6b6b;--line:#d9d9d9;--accent:#1f6feb;--tint:#1f6feb14}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#fff;--muted:#9a9a9a;--line:#333;--accent:#58a6ff;--tint:#58a6ff1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{max-width:640px;margin:0 auto;padding:32px 16px 96px}
h1{font-size:22px;letter-spacing:-.03em;margin:0 0 4px}
h2{font-size:15px;margin:32px 0 2px}
p{margin:0 0 12px;color:var(--muted);font-size:12px}
.vol{display:flex;gap:12px;align-items:center;margin:16px 0;font-size:12px;color:var(--muted)}
.vol input{flex:1}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--tint)}
.opt input{accent-color:var(--accent)}
.opt .n{flex:1}
.opt .d{display:block;color:var(--muted);font-size:11px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
.sum{margin-top:32px;border:1px solid var(--line);border-radius:10px;padding:12px}
.sum code{display:block;white-space:pre-wrap;margin:8px 0}
</style>
</head>
<body>
<main>
  <h1>thisblock sounds</h1>
  <p>Press play on each one, pick your favourite in each group, then copy the summary at the bottom and send it back.</p>
  <label class="vol">volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6"></label>
  <div id="groups"></div>
  <div class="sum">
    <div>Your choice</div>
    <code id="out"></code>
    <button id="copy">copy</button>
  </div>
</main>
<script>
let ctx;
const vol = document.getElementById('vol');
function ac() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

/* One note: a few sine/triangle partials with a soft attack and an exponential decay. */
function note(out, t, freq, dur, o = {}) {
  const c = ctx;
  const { type = 'sine', gain = 0.5, attack = 0.005, partials = [[1, 1]], glideFrom = 0 } = o;
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g.connect(out);
  for (const [mult, amp] of partials) {
    const osc = c.createOscillator();
    const pg = c.createGain();
    osc.type = type;
    if (glideFrom) {
      osc.frequency.setValueAtTime(glideFrom * mult, t);
      osc.frequency.exponentialRampToValueAtTime(freq * mult, t + Math.min(0.12, dur / 2));
    } else {
      osc.frequency.setValueAtTime(freq * mult, t);
    }
    pg.gain.value = amp;
    osc.connect(pg).connect(g);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }
}
const BELL = [[1, 1], [2.76, 0.35], [5.4, 0.15]];
const WOOD = [[1, 1], [2.3, 0.4]];
const BOWL = [[1, 1], [2.71, 0.3], [4.1, 0.12]];
const N = { C4: 261.63, E4: 329.63, G4: 392, A4: 440, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880, B5: 987.77, C6: 1046.5, E6: 1318.5 };

/* All variations share one idea: a glide and a bell sparkle (the "open sweep"). */
const sweep = (o, t, from, to, dur, gain = .3) => note(o, t, to, dur, { glideFrom: from, gain, partials: [[1, 1], [2, .3]] });
const spark = (o, t, f, dur = .9, gain = .22) => note(o, t, f, dur, { partials: BELL, gain });

const SOUNDS = {
  join: {
    title: 'New session', hint: 'a session starts: come and join (glide up, bright sparkle)',
    list: [
      { id: 'open-sweep', name: 'Open sweep (the original)', d: 'A4 up to A5, then a high sparkle',
        play: (o, t) => { sweep(o, t, N.A4, N.A5, .6); spark(o, t + .5, N.E6); } },
      { id: 'open-sweep-long', name: 'Open sweep, wider', d: 'a longer glide from low C to high, two sparkles',
        play: (o, t) => { sweep(o, t, N.C4, N.C6, .8, .28); spark(o, t + .65, N.E6, 1.1); spark(o, t + .85, N.C6 * 2, 1.3, .14); } },
      { id: 'open-sweep-quick', name: 'Open sweep, quick', d: 'short and light, one sparkle',
        play: (o, t) => { sweep(o, t, N.E5, N.E6 / 1.25, .3, .26); spark(o, t + .25, N.E6, .7, .2); } },
      { id: 'open-sweep-double', name: 'Open sweep, double', d: 'two glides up, the second higher, like a call',
        play: (o, t) => { sweep(o, t, N.A4, N.A5, .4, .26); sweep(o, t + .38, N.C5, N.C6, .45, .28); spark(o, t + .8, N.E6, 1.2); } },
    ],
  },
  wrap: {
    title: 'Wrap up', hint: 'the last focus block starts: finish the thought (same glide, a nudge more insistent)',
    list: [
      { id: 'wrap-sweep-twice', name: 'Sweep, twice', d: 'the same glide and sparkle repeated once',
        play: (o, t) => { [0, .85].forEach((x) => { sweep(o, t + x, N.A4, N.A5, .5, .28); spark(o, t + x + .42, N.E6, .7); }); } },
      { id: 'wrap-sweep-hold', name: 'Sweep and hold', d: 'glide up, then a held bell that rings on',
        play: (o, t) => { sweep(o, t, N.A4, N.A5, .55); spark(o, t + .5, N.A5, 2.2, .3); spark(o, t + .5, N.E6, 2, .16); } },
      { id: 'wrap-sweep-stair', name: 'Sweep, stepped', d: 'three short glides climbing, a gentle "almost there"',
        play: (o, t) => { [[N.C5, N.E5], [N.E5, N.G5], [N.G5, N.C6]].forEach(([f, to], i) => sweep(o, t + i * .3, f, to, .25, .26)); spark(o, t + .95, N.E6, 1.2); } },
      { id: 'wrap-sweep-low', name: 'Sweep, low and warm', d: 'lower pitch, rounder, less sparkle',
        play: (o, t) => { sweep(o, t, N.E4, N.E5, .7, .32); spark(o, t + .6, N.G5, 1.6, .26); } },
    ],
  },
  break: {
    title: 'Break', hint: 'the break starts: you can rest (glide down, soft landing)',
    list: [
      { id: 'break-sweep-down', name: 'Sweep down', d: 'the open sweep mirrored: glide down, low bell lands',
        play: (o, t) => { sweep(o, t, N.A5, N.A4, .7); spark(o, t + .6, N.E4 * .75, 1.8, .3); } },
      { id: 'break-sweep-sigh', name: 'Sweep, sigh', d: 'slow, wide glide down and a long fade',
        play: (o, t) => { sweep(o, t, N.C6, N.C4, 1.1, .26); spark(o, t + .95, N.G4, 2.6, .24); } },
      { id: 'break-sweep-settle', name: 'Sweep, settle (improved)', d: 'two overlapping glides down, a warm low bell lands and rings out',
        play: (o, t) => {
          const warm = ctx.createBiquadFilter(); warm.type = 'lowpass'; warm.frequency.value = 2200; warm.connect(o);
          note(warm, t, N.E5, .75, { glideFrom: N.G5, attack: .04, gain: .22, partials: [[1, 1], [2, .3]] });
          note(warm, t + .35, N.C5, .8, { glideFrom: N.E5, attack: .04, gain: .16, partials: [[1, 1], [2, .3]] });
          note(warm, t + .85, N.C5, 3, { partials: BELL, gain: .22 });
          note(warm, t + .85, N.C5 / 2, 3.4, { attack: .03, gain: .2, partials: [[1, 1], [2, .2]] });
        } },
      { id: 'break-sweep-bowl', name: 'Sweep into a bowl', d: 'short glide down into a singing-bowl tone',
        play: (o, t) => { sweep(o, t, N.A5, N.G4, .45, .24); note(o, t + .4, 396, 3.5, { partials: BOWL, attack: .03, gain: .4 }); note(o, t + .4, 399, 3.5, { attack: .03, gain: .2 }); } },
    ],
  },
};

function play(opt) {
  const c = ac();
  const master = c.createGain();
  master.gain.value = Number(vol.value);
  master.connect(c.destination);
  opt.play(master, c.currentTime + 0.03);
}

const choice = {};
const groupsEl = document.getElementById('groups');
for (const [key, grp] of Object.entries(SOUNDS)) {
  choice[key] = grp.list[0];
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${grp.title}</h2><p>${grp.hint}</p>`;
  grp.list.forEach((opt, i) => {
    const row = document.createElement('label');
    row.className = 'opt' + (i === 0 ? ' sel' : '');
    row.innerHTML = `<input type="radio" name="${key}" ${i === 0 ? 'checked' : ''}><span class="n">${i + 1}. ${opt.name}<span class="d">${opt.d}</span></span>`;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'play';
    btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); play(opt); });
    row.append(btn);
    row.querySelector('input').addEventListener('change', () => {
      choice[key] = opt;
      sec.querySelectorAll('.opt').forEach((r) => r.classList.remove('sel'));
      row.classList.add('sel');
      summary();
    });
    sec.append(row);
  });
  groupsEl.append(sec);
}

const out = document.getElementById('out');
function summary() {
  out.textContent = Object.entries(SOUNDS).map(([k, g]) => `${g.title}: ${choice[k].name} (${choice[k].id})`).join('\n');
}
summary();
document.getElementById('copy').addEventListener('click', (e) => {
  navigator.clipboard?.writeText(out.textContent).then(() => { e.target.textContent = 'copied'; setTimeout(() => { e.target.textContent = 'copy'; }, 1200); }).catch(() => {});
});
</script>
</body>
</html>
